name: Test
on: [push, pull_request]
permissions:
  contents: read
jobs:
  # The offline Python: the reference engine, bots, card tables, training,
  # evaluation, the table model the parity check compares with, and the
  # short-deck prototype. Python 3.12 from .python-version, packages from uv.lock.
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v6
      - uses: astral-sh/setup-uv@v7
      - run: uv sync --locked
      - run: uv run --locked rivermind-poker --help
      - run: uv run --locked pytest

  # The SvelteKit app and the TypeScript table server: types, lint, unit and
  # database tests, the parity checks against the Python references, the
  # production build, and Playwright in three browsers against the built Node
  # server serving the tables itself, as the live site does.
  web:
    runs-on: ubuntu-latest
    # A run takes about 15 minutes, but Playwright's system packages come from
    # Ubuntu's mirror, which has taken half an hour on a slow day.
    timeout-minutes: 50
    # PostgreSQL for the Vitest database tests (*.db.spec.ts), which fail
    # rather than skip in CI. The parity checks run the Python references, so
    # the job needs uv as well.
    services:
      postgres:
        image: postgres:18
        env:
          POSTGRES_USER: rivermind
          POSTGRES_PASSWORD: rivermind
          POSTGRES_DB: rivermind_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U rivermind -d rivermind_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      RIVERMIND_TEST_DATABASE_URL: postgresql://rivermind:rivermind@localhost:5432/rivermind_test
    defaults:
      run:
        working-directory: web
    steps:
      - uses: actions/checkout@v6
      - uses: astral-sh/setup-uv@v7
      - run: uv sync --locked
        working-directory: .
      - uses: pnpm/action-setup@v6
        with:
          package_json_file: web/package.json
      - uses: actions/setup-node@v7
        with:
          node-version-file: web/.node-version
          cache: pnpm
          cache-dependency-path: web/pnpm-lock.yaml
      - run: pnpm install --frozen-lockfile
      - run: pnpm check
      - run: pnpm lint
      - run: pnpm test
      # The TypeScript engine against the Python reference: 5,000 fuzzed hands
      # (625 at each of 2 to 9 seats) byte for byte, and evaluator samples.
      - run: pnpm engine:parity
      # The TypeScript bots against the Python ones: 2,000 hands of the simple
      # bots on fuzz deals, 2,000 blueprint decisions and bucket lookups on a
      # synthetic serving bundle (the real trees, random strategies and tables).
      - run: pnpm bots:parity
      # The TypeScript table against the Python one: 100 fuzzed sequences of
      # 250 requests each (seating, holds, the waitlist, hands, clocks and
      # snapshot round trips), every answer, event and snapshot by digest.
      - run: pnpm table:parity
      - run: pnpm build
      - run: pnpm exec playwright install --with-deps chromium firefox webkit
      - run: pnpm e2e
        env:
          E2E_SKIP_BUILD: '1'
      # Table voice (Phase 4C): RFC 9605's test vectors on each engine's own
      # WebCrypto, and a WebRTC call whose frames are sealed and opened in the
      # encoded-transform worker, built as the client is and under the site's CSP.
      - run: pnpm voice:check
      - if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: playwright-report
          path: |
            web/playwright-report/
            web/test-results/
            web/test-results-voice-check/
          retention-days: 7
