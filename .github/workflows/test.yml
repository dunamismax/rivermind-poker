name: Test
on: [push, pull_request]
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    # PostgreSQL for the database tests, which fail rather than skip in CI.
    services:
      postgres:
        image: postgres:18
        env:
          POSTGRES_USER: rivermind
          POSTGRES_PASSWORD: rivermind
          POSTGRES_DB: rivermind_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U rivermind -d rivermind_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      RIVERMIND_TEST_DATABASE_URL: postgresql://rivermind:rivermind@localhost:5432/rivermind_test
    steps:
      - uses: actions/checkout@v6
      - uses: astral-sh/setup-uv@v7
      - run: uv sync --locked
      - run: uv run --locked rivermind-poker --help
      - run: uv run --locked pytest

  # The SvelteKit client: types, lint, unit tests, the production build and
  # Playwright in three browsers against the built Node server, which forwards
  # /api and /ws to the real Python table server until the P4B.7 cutover.
  web:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    # PostgreSQL for the Vitest database tests (*.db.spec.ts), which fail
    # rather than skip in CI.
    services:
      postgres:
        image: postgres:18
        env:
          POSTGRES_USER: rivermind
          POSTGRES_PASSWORD: rivermind
          POSTGRES_DB: rivermind_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U rivermind -d rivermind_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      RIVERMIND_TEST_DATABASE_URL: postgresql://rivermind:rivermind@localhost:5432/rivermind_test
    defaults:
      run:
        working-directory: web
    steps:
      - uses: actions/checkout@v6
      - uses: astral-sh/setup-uv@v7
      - run: uv sync --locked
        working-directory: .
      - uses: pnpm/action-setup@v6
        with:
          package_json_file: web/package.json
      - uses: actions/setup-node@v7
        with:
          node-version-file: web/.node-version
          cache: pnpm
          cache-dependency-path: web/pnpm-lock.yaml
      - run: pnpm install --frozen-lockfile
      - run: pnpm check
      - run: pnpm lint
      - run: pnpm test
      # The TypeScript engine against the Python reference: 5,000 fuzzed hands
      # (625 at each of 2 to 9 seats) byte for byte, and evaluator samples.
      - run: pnpm engine:parity
      - run: pnpm build
      - run: pnpm exec playwright install --with-deps chromium firefox webkit
      - run: pnpm e2e
        env:
          E2E_SKIP_BUILD: '1'
      - if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: playwright-report
          path: |
            web/playwright-report/
            web/test-results/
          retention-days: 7
